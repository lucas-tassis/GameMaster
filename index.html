<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Master — Evento de Jogos de Tabuleiro</title>
  <meta name="description" content="Aplicativo de gestão para eventos de jogos de tabuleiro. Credenciamento, acervo de jogos, empréstimos e envio de fotos/notas fiscais.">
  
  <!-- Fontes Google: Outfit (Títulos) & Inter (Corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header / App Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">🎲</div>
        <div class="brand-text">
          <h1>Game Master</h1>
          <span class="brand-subtitle">Evento de Jogos no Mall</span>
        </div>
      </div>
      <div class="header-status">
        <span class="status-badge live" id="live-indicator">
          <span class="pulse-dot"></span> Evento Ativo
        </span>
      </div>
    </div>
  </header>

  <!-- Navegação por Abas (Bottom Nav no celular, Top Nav no desktop) -->
  <nav class="app-nav">
    <div class="nav-container">
      <button class="nav-btn active" data-tab="dashboard" id="nav-dashboard-btn">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Painel</span>
      </button>
      <button class="nav-btn" data-tab="presenca" id="nav-presenca-btn">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Presença</span>
      </button>
      <button class="nav-btn" data-tab="acervo" id="nav-acervo-btn">
        <span class="nav-icon">🎲</span>
        <span class="nav-label">Acervo</span>
      </button>
      <button class="nav-btn" data-tab="fotos" id="nav-fotos-btn">
        <span class="nav-icon">📸</span>
        <span class="nav-label">Fotos</span>
      </button>
      <button class="nav-btn" data-tab="notas" id="nav-notas-btn">
        <span class="nav-icon">🧾</span>
        <span class="nav-label">Notas</span>
      </button>
      <button class="nav-btn" data-tab="config" id="nav-config-btn">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Ajustes</span>
      </button>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="app-main">
    
    <!-- 1. PAINEL / DASHBOARD -->
    <section id="tab-dashboard" class="tab-panel active">
      <!-- O conteúdo será injetado via JS (dashboard.js) -->
    </section>

    <!-- 2. PRESENÇA (CREDENCIAMENTO PÚBLICO) -->
    <section id="tab-presenca" class="tab-panel">
      <!-- O conteúdo será injetado via JS (presenca.js) -->
    </section>

    <!-- 3. ACERVO & EMPRÉSTIMOS DE JOGOS -->
    <section id="tab-acervo" class="tab-panel">
      <!-- O conteúdo será injetado via JS (acervo.js) -->
    </section>

    <!-- 4. FOTOS DO EVENTO -->
    <section id="tab-fotos" class="tab-panel">
      <!-- O conteúdo será injetado via JS (fotos.js) -->
    </section>

    <!-- 5. NOTAS FISCAIS DO MALL -->
    <section id="tab-notas" class="tab-panel">
      <!-- O conteúdo será injetado via JS (notas.js) -->
    </section>

    <!-- 6. CONFIGURAÇÕES & GOOGLE DRIVE -->
    <section id="tab-config" class="tab-panel">
      <!-- O conteúdo será injetado via JS (config.js) -->
    </section>

  </main>

  <!-- Container de Notificações Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Genérico para Empréstimos e Formulários -->
  <div id="app-modal" class="modal-backdrop hidden">
    <div class="modal-card" id="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Título do Modal</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Conteúdo dinâmico do modal -->
      </div>
    </div>
  </div>

  <!-- Scripts JavaScript da Aplicação -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
