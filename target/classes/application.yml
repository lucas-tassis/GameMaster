server:
  port: 8085
  address: 0.0.0.0
  servlet:
    context-path: /



spring:
  application:
    name: GameMaster
  
  # Banco de dados H2 (desenvolvimento)
  datasource:
    url: jdbc:h2:mem:gamemasterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # OAuth2 Client (opcional em dev, ativado quando fornecido no Google Cloud Console)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile

# Configurações do Game Master
gamemaster:
  drive:
    script-url: ${GOOGLE_SCRIPT_URL:}
  admin-emails:
    - "admin@gamemaster.com"

# Configurações da API da Ludopedia (OAuth 2.0)
ludopedia:
  api:
    token: ${LUDOPEDIA_TOKEN:}
    app-id: ${LUDOPEDIA_APP_ID:}
    app-key: ${LUDOPEDIA_APP_KEY:}
    redirect-uri: ${LUDOPEDIA_REDIRECT_URI:http://localhost:8085/api/v1/ludopedia/oauth/callback}

