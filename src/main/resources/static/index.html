<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Master — Evento de Jogos de Tabuleiro (Spring Boot)</title>
  <meta name="description" content="Aplicativo de gestão em Java Spring Boot para eventos de jogos de tabuleiro. Credenciamento, acervo, empréstimos e mídia.">
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <img src="images/logo.png" alt="Game Master Logo" class="brand-logo-img" style="height: 48px; max-height: 48px; width: auto; object-fit: contain;">
      </div>
      <div class="header-status" style="display: flex; gap: 0.5rem; align-items: center;">
        <span class="status-badge live" id="live-indicator">
          <span class="pulse-dot"></span> Backend Ativo
        </span>
        <button id="btn-auth-mode" class="btn btn-sm btn-secondary" style="font-size: 0.78rem; padding: 0.35rem 0.75rem; border-radius: 9999px;">🔐 Entrar como Admin</button>
      </div>
    </div>
  </header>

  <!-- Navegação por Abas -->
  <nav class="app-nav">
    <div class="nav-container">
      <button class="nav-btn active" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Painel</span>
      </button>
      <button class="nav-btn" data-tab="presenca">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Presença</span>
      </button>
      <button class="nav-btn" data-tab="acervo">
        <span class="nav-icon">🎲</span>
        <span class="nav-label">Acervo</span>
      </button>
      <button class="nav-btn" data-tab="fotos">
        <span class="nav-icon">📸</span>
        <span class="nav-label">Fotos</span>
      </button>
      <button class="nav-btn" data-tab="notas">
        <span class="nav-icon">🧾</span>
        <span class="nav-label">Notas</span>
      </button>
      <button class="nav-btn" data-tab="usuarios" data-admin-only="true">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Usuários</span>
      </button>
      <button class="nav-btn" data-tab="eventos" data-admin-only="true">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Eventos</span>
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="app-main">
    <section id="tab-dashboard" class="tab-panel active"></section>
    <section id="tab-presenca" class="tab-panel"></section>
    <section id="tab-acervo" class="tab-panel"></section>
    <section id="tab-fotos" class="tab-panel"></section>
    <section id="tab-notas" class="tab-panel"></section>
    <section id="tab-usuarios" class="tab-panel"></section>
    <section id="tab-eventos" class="tab-panel"></section>
  </main>



  <div id="toast-container" class="toast-container"></div>

  <!-- Modal -->
  <div id="app-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Título do Modal</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
