server:
  port: ${PORT:8085}
  address: 0.0.0.0
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: ".*"
  servlet:
    context-path: /



spring:
  application:
    name: GameMaster
  
  # Banco de dados H2 (desenvolvimento)
  datasource:
    url: jdbc:h2:mem:gamemasterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # OAuth2 Client (Google SSO)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

# Configurações do Game Master
gamemaster:
  drive:
    script-url: ${GOOGLE_SCRIPT_URL:}
  admin-emails:
    - "lucastassis2@gmail.com"
    - "admin@gamemaster.com"
